error_log stderr ${NGINX_ERROR_LOG_LEVEL};

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness del contenedor (ADR 0021): no depende de la SPA ni del enrutado del cliente.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
