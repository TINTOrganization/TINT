# Entorno local completo de TINT.
# Uso: cp .env.example .env && docker compose up -d

x-env-check: &env-check
  depends_on:
    env-check:
      condition: service_completed_successfully

services:
  env-check:
    image: alpine:3.20
    container_name: tint-env-check
    env_file:
      - path: .env
        required: true
    command:
      - /bin/sh
      - -ec
      - |
        missing=""
        for variable in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB \
          MINIO_ROOT_USER MINIO_ROOT_PASSWORD MINIO_BUCKET \
          JWT_SECRET JWT_ISSUER JWT_AUDIENCE FIREBASE_PROJECT_ID TURN_SECRET; do
          value=$$(printenv "$$variable" || true)
          if [ -z "$$value" ]; then
            missing="$$missing\n  - $$variable"
          fi
        done
        if [ -n "$$missing" ]; then
          printf 'Missing required variables in .env:%b\n' "$$missing" >&2
          exit 1
        fi
        echo "Environment validation passed"

  # Entrada pública única: redirige HTTP a HTTPS y enruta APIs y WebSockets.
  gateway:
    image: caddy:2.9-alpine
    container_name: tint-gateway
    restart: unless-stopped
    <<: *env-check
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    environment:
      GATEWAY_HOST: ${GATEWAY_HOST:-localhost}
      GATEWAY_HTTPS_PORT: ${GATEWAY_HTTPS_PORT:-443}
      IDENTITY_API_UPSTREAM: ${IDENTITY_API_UPSTREAM:-identity-api:8081}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway-data:/data
      - gateway-config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "--no-check-certificate", "https://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./apps/web
    container_name: tint-web
    <<: *env-check
    ports:
      - "${WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: tint-postgres
    <<: *env-check
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tint}
      POSTGRES_DB: ${POSTGRES_DB:-tint}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tint} -d ${POSTGRES_DB:-tint}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tint-redis
    <<: *env-check
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    #image: minio/minio:latest
    image: pgsty/minio:latest # Usamos la imagen pgsty dado que la oficial de minio no está disponible actualmente.
    container_name: tint-minio
    <<: *env-check
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tintadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tintadmin123}
      # El navegador sube y reproduce directo desde MinIO con URLs firmadas.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:5173}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea el bucket de media al arrancar y termina.
  minio-init:
    #image: minio/mc:latest
    image: pgsty/mc:latest # Usamos la imagen pgsty dado que la oficial de minio no está disponible actualmente.
    container_name: tint-minio-init
    <<: *env-check
    depends_on:
      env-check:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      echo '{\"Rules\":[{\"ID\":\"incoming-expira\",\"Status\":\"Enabled\",\"Filter\":{\"Prefix\":\"incoming/\"},\"Expiration\":{\"Days\":2}}]}' |
      mc ilm import local/$${MINIO_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tintadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tintadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-tint-media}

  # Media worker (Python + FFmpeg): consume media:uploads, valida el vídeo subido
  # a incoming/, extrae el Ambilight y publica {id}/source.<ext> + ambilight.json.
  media-worker:
    build: ./services/media-worker
    container_name: tint-media-worker
    restart: unless-stopped
    <<: *env-check
    depends_on:
      env-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tint}:${POSTGRES_PASSWORD:-tint}@postgres:5432/${POSTGRES_DB:-tint}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-tintadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-tintadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-tint-media}
      MEDIA_WORKER_CONSUMER: media-worker-1
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Analítica (Python): consume analytics:events, guarda telemetry_events/room_kpis y
  # expone la API de solo lectura de KPIs para el host. JWT_* deben ser los de identity-api.
  analytics:
    build: ./services/analytics
    container_name: tint-analytics
    restart: unless-stopped
    <<: *env-check
    depends_on:
      env-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tint}:${POSTGRES_PASSWORD:-tint}@postgres:5432/${POSTGRES_DB:-tint}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      JWT_ISSUER: ${JWT_ISSUER:-tint-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tint:room}
      ANALYTICS_PORT: ${ANALYTICS_PORT:-8084}
      # Orígenes (con esquema) que pueden llamar a la API desde el navegador.
      ANALYTICS_ALLOWED_ORIGINS: ${ANALYTICS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ANALYTICS_CONSUMER: analytics-1
      # Horas sin actividad tras las que una sala se da por cerrada (REQ-07) y se consolidan sus KPIs.
      ANALYTICS_ROOM_GRACE_HOURS: ${ANALYTICS_ROOM_GRACE_HOURS:-12}
      # Zona horaria del corte del día en DAU/MAU.
      ANALYTICS_TIMEZONE: ${ANALYTICS_TIMEZONE:-America/Bogota}
      # Contraseña compartida del panel de negocio (/analitica); vacía = panel deshabilitado.
      ANALYTICS_ADMIN_PASSWORD: ${ANALYTICS_ADMIN_PASSWORD:-}
    ports:
      - "${ANALYTICS_PORT:-8084}:${ANALYTICS_PORT:-8084}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f\"http://localhost:{os.environ['ANALYTICS_PORT']}/healthz\", timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Canal Social (/ws/social): chat en vivo con historial corto en Redis.
  social-core:
    build: ./services/social-core
    container_name: tint-social-core
    <<: *env-check
    ports:
      - "8082:8082"
    environment:
      SOCIAL_CORE_ADDR: ":8082"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      JWT_ISSUER: ${JWT_ISSUER:-tint-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tint:room}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-tint-login}
      # Orígenes (host[:puerto]) que pueden abrir /ws/social.
      ALLOWED_ORIGINS: ${SOCIAL_ALLOWED_ORIGINS:-localhost:5173,127.0.0.1:5173}
      SOCIAL_REACTION_LIMIT: ${SOCIAL_REACTION_LIMIT:-5}
      SOCIAL_REACTION_IP_LIMIT: ${SOCIAL_REACTION_IP_LIMIT:-5}
      SOCIAL_REACTION_WINDOW_MS: ${SOCIAL_REACTION_WINDOW_MS:-1000}
    depends_on:
      env-check:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Canal Sync (Go). JWT_SECRET debe ser el mismo que usa identity-api.
  sync-core:
    build: ./services/sync-core
    container_name: tint-sync-core
    <<: *env-check
    depends_on:
      env-check:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      SYNC_CORE_ADDR: ":8080"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      JWT_ISSUER: ${JWT_ISSUER:-tint-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tint:room}
      ALLOWED_ORIGINS: ${SYNC_ALLOWED_ORIGINS:-localhost:5173,127.0.0.1:5173}
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-api:
    build: ./services/identity-api
    container_name: tint-identity-api
    restart: unless-stopped
    <<: *env-check
    depends_on:
      env-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      IDENTITY_API_PORT: 8081
      NODE_ENV: production
      AUTH_PROVIDER: ${AUTH_PROVIDER:-firebase}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tint}:${POSTGRES_PASSWORD:-tint}@postgres:5432/${POSTGRES_DB:-tint}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      JWT_ISSUER: ${JWT_ISSUER:-tint-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tint:room}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-tint-login}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-tintadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-tintadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-tint-media}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/api/v1/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Canal de Voz (C++): señalización WebRTC (/ws/voice), membresía y moderación de la voz.
  # El audio viaja P2P entre navegadores; coturn hace de STUN/TURN. JWT_* deben ser los de identity-api.
  voice-core:
    build: ./services/voice-core
    container_name: tint-voice-core
    <<: *env-check
    depends_on:
      env-check:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      VOICE_CORE_ADDR: "0.0.0.0:8085"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      JWT_ISSUER: ${JWT_ISSUER:-tint-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tint:room}
      ALLOWED_ORIGINS: ${VOICE_ALLOWED_ORIGINS:-localhost:5173,127.0.0.1:5173}
      VOICE_MAX_MEMBERS: ${VOICE_MAX_MEMBERS:-8}
      STUN_URLS: ${STUN_URLS:-stun:localhost:3478}
      TURN_URLS: ${TURN_URLS:-turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp}
      TURN_SECRET: ${TURN_SECRET:-dev-turn-secret-change-in-prod}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-3600}
    ports:
      - "8085:8085"

  # STUN/TURN para la voz. Red del host: el relay debe anunciar direcciones alcanzables
  # desde el navegador (en Linux). Credenciales efímeras firmadas con TURN_SECRET (REST API de TURN).
  coturn:
    image: coturn/coturn:4.6.3
    container_name: tint-coturn
    <<: *env-check
    network_mode: host
    command:
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:-dev-turn-secret-change-in-prod}"
      - "--realm=tint.local"
      - "--fingerprint"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--log-file=stdout"

volumes:
  gateway-data:
  gateway-config:
  postgres-data:
  redis-data:
  minio-data:
